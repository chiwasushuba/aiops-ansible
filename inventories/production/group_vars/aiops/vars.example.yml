---
# Copy to vars.yml. Target: Oracle A1 Flex, 1 OCPU / 6 GB, Ubuntu 24.04 arm64.
# Verify tenancy eligibility, remaining allowance and capacity in the home region.
aiops_container_platform: linux/arm64
aiops_api_domain: api.example.com
aiops_frontend_origin: https://app.example.com

# Build OFF the Oracle VM, with --platform linux/arm64. Choose an archive with a
# reachable registry image pinned by digest (leave archive empty in that case).
aiops_backend_image: aiops-backend:REPLACE_WITH_RELEASE-arm64
aiops_backend_image_archive: /mnt/c/Users/joshua/Desktop/aiops-backend-REPLACE_WITH_RELEASE-arm64.tar
# Registry alternative:
# aiops_backend_image: ghcr.io/chiwasushuba/aiops-backend@sha256:<64-hex-digest>
# aiops_backend_image_archive: ""

aiops_owner_login: owner
aiops_owner_name: Owner
aiops_owner_timezone: Asia/Manila
# Prefer app.example.com on Vercel and api.example.com on OCI: SameSite=Lax.
# For unrelated sites, use "none" only after reviewing third-party cookie limits.
aiops_cookie_same_site: lax

# Initial budgets for the 6 GB A1 VM; measure startup/RSS before real use.
aiops_backend_memory: 1024m
aiops_postgres_memory: 512m
aiops_proxy_memory: 128m
aiops_java_tool_options: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m
aiops_backup_retention_days: 7

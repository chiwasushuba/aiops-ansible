---
aiops_install_dir: /opt/aiops
aiops_backup_dir: /var/backups/aiops
aiops_project_name: aiops
aiops_container_platform: linux/arm64
aiops_backend_image_archive: ""
aiops_postgres_image: postgres:17-alpine
aiops_proxy_image: caddy:2-alpine
aiops_postgres_db: aiops
aiops_postgres_user: aiops
aiops_owner_login: owner
aiops_owner_name: Owner
aiops_owner_timezone: Asia/Manila
aiops_cookie_same_site: lax
aiops_backend_memory: 1024m
aiops_postgres_memory: 512m
aiops_proxy_memory: 128m
aiops_java_tool_options: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m
aiops_openai_api_key: ""
aiops_openai_model: gpt-6-luna
aiops_openai_max_output_tokens: 2048
aiops_openai_daily_run_limit: 100
aiops_gmail_client_id: ""
aiops_gmail_client_secret: ""
aiops_gmail_token_key: ""
aiops_backup_retention_days: 7
aiops_health_timeout: 300
